services:
  app:
    image: fw-app:latest
    container_name: fw-app
    depends_on:
      - db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--spring.datasource.url=jdbc:mysql://db:3306/todoapp"]
    ports:
      - "8080:8080"
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: fw-mysql
    environment:
      MYSQL_DATABASE: todoapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - fw-db-data:/var/lib/mysql

volumes:
  fw-db-data:
