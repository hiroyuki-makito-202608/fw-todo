services:
  app:
    image: fw-app:latest
    build: .
    container_name: fw-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/todoapp
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: fw-mysql
    environment:
      MYSQL_DATABASE: todoapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - fw-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysql -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fw-db-data:
