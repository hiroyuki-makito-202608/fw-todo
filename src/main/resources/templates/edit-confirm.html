<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集内容の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">編集内容の確認</h1>
        <p class="confirm-value">やること：<span th:text="${todo.title}"></span></p>
        <p class="confirm-value">メモ：<span th:text="${todo.detail}"></span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category}"></span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"></span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate}"></span></p>
        <p class="confirm-value">状態：<span th:text="${todo.status == 'IN_PROGRESS' ? '進行中' : (todo.status == 'COMPLETED' ? '完了' : '未着手')}"></span></p>
        <section class="confirm-value" th:if="${!#lists.isEmpty(todo.subtasks)}">
            <strong>サブタスク</strong>
            <ul><li th:each="subtask : ${todo.subtasks}" th:if="${!#strings.isEmpty(subtask)}" th:text="${subtask}"></li></ul>
        </section>
        <div class="confirm-actions">
            <form th:action="@{/todos/{id}(id=${todo.id})}" method="post">
                <input type="hidden" name="title" th:value="${todo.title}">
                <input type="hidden" name="detail" th:value="${todo.detail}">
                <input type="hidden" name="category" th:value="${todo.category}">
                <input type="hidden" name="priority" th:value="${todo.priority}">
                <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
                <input type="hidden" name="status" th:value="${todo.status}">
                <input th:each="subtask, stat : ${todo.subtasks}" type="hidden" th:name="|subtasks[${stat.index}]|" th:value="${subtask}">
                <button class="btn" type="submit">保存する</button>
            </form>
            <form th:action="@{/todos/{id}/edit(id=${todo.id})}" method="post">
                <input type="hidden" name="title" th:value="${todo.title}">
                <input type="hidden" name="detail" th:value="${todo.detail}">
                <input type="hidden" name="category" th:value="${todo.category}">
                <input type="hidden" name="priority" th:value="${todo.priority}">
                <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
                <input type="hidden" name="status" th:value="${todo.status}">
                <input th:each="subtask, stat : ${todo.subtasks}" type="hidden" th:name="|subtasks[${stat.index}]|" th:value="${subtask}">
                <button class="btn sub" type="submit">書き直す</button>
            </form>
        </div>
    </main>
</body>
</html>
