<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること編集</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">やること編集</h1>
        <section class="form-row">
            <h2>添付ファイル</h2>
            <ul><li th:each="attachment : ${attachments}">
                <a th:href="@{/attachments/{id}/download(id=${attachment.id})}" th:text="${attachment.originalFileName}"></a>
                <form th:action="@{/attachments/{id}/delete(id=${attachment.id})}" method="post" style="display:inline">
                    <input type="hidden" name="todoId" th:value="${todo.id}"><button type="submit">削除</button>
                </form>
            </li></ul>
            <form th:action="@{/todos/{id}/attachments(id=${todo.id})}" method="post" enctype="multipart/form-data">
                <input type="file" name="attachment" required><button type="submit">添付</button>
            </form>
        </section>
        <form th:action="@{/todos/{id}/confirm(id=${todo.id})}" th:object="${todo}" method="post">
            <div class="form-row">
                <label class="form-label" for="title">やること</label>
                <input class="form-input" id="title" type="text" th:field="*{title}">
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="detail">メモ</label>
                <input class="form-input" id="detail" type="text" th:field="*{detail}">
                <p class="error" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" th:field="*{category}">
                    <option value="">選択してください</option>
                    <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
                <div class="category-create-row">
                    <input class="form-input" id="newCategory" type="text" maxlength="255" placeholder="新しいジャンル名">
                    <button class="btn sub" type="button" id="addCategory">新規登録</button>
                </div>
                <p class="category-help">ジャンル名を入力して「新規登録」を押すと、選択肢に追加されます。</p>
            </div>
            <div class="form-row">
                <label class="form-label" for="priority">優先度</label>
                <select class="form-input" id="priority" th:field="*{priority}">
                    <option value="">選択してください</option>
                    <option value="1">高</option>
                    <option value="2">中</option>
                    <option value="3">低</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="dueDate">期限</label>
                <input class="form-input" id="dueDate" type="date" th:field="*{dueDate}">
            </div>
            <div class="form-row">
                <label class="form-label" for="completed">完了</label>
                <input class="form-input" id="completed" type="checkbox" th:field="*{completed}">
            </div>
            <button class="btn" type="submit">確認する</button>
            <a class="btn sub" href="/todos">一覧へ</a>
        </form>
    </main>
    <script>
        document.getElementById('addCategory').addEventListener('click', function () {
            const input = document.getElementById('newCategory');
            const name = input.value.trim();
            const select = document.getElementById('category');
            if (!name) return;
            const existing = Array.from(select.options).find(option => option.value === name);
            if (existing) {
                select.value = name;
                input.value = '';
                return;
            }
            const body = new URLSearchParams({ name });
            fetch('/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body
            }).then(async response => {
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'ジャンルを登録できませんでした。');
                select.add(new Option(result.name, result.name, true, true));
                input.value = '';
            }).catch(error => window.alert(error.message));
        });
    </script>
</body>
</html>
