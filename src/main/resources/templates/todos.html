<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">やること一覧</h1>
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <a class="btn" href="/todos/new">新規登録</a>
        <a class="btn sub" href="/calendar">カレンダーで見る</a>
        <a class="btn sub" href="/kanban">カンバンボード</a>

        <form class="search-bar" action="/todos" method="get">
            <input type="hidden" name="order" th:value="${order}">
            <label>やることの名前
                <input class="form-input" type="text" name="keyword" th:value="${keyword}">
            </label>
            <label>ジャンル
                <select class="form-input" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option th:each="categoryOption : ${categories}" th:value="${categoryOption}" th:text="${categoryOption}" th:selected="${category == categoryOption}"></option>
                </select>
            </label>
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc')}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc')}">期限が遠い順</a>
        </form>

        <p th:if="${#lists.isEmpty(todos)}">まだ登録されているやることはありません。</p>
        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(T(java.time.LocalDate).now()) and !todo.completed} ? 'overdue-row' : ''">
                    <td>
                        <div class="todo-title-cell">
                            <span th:text="${todo.title}">やること</span>
                            <span class="todo-badges">
                                <span class="attachment-badge" th:if="${todo.attachmentCount != null and todo.attachmentCount > 0}">添付有</span>
                                <span class="subtask-badge" th:if="${todo.subtaskCount != null and todo.subtaskCount > 0}"
                                      th:text="|サブタスク ${todo.completedSubtaskCount}/${todo.subtaskCount}|">サブタスク 0/0</span>
                            </span>
                        </div>
                    </td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</td>
                    <td th:text="${todo.dueDate}">期限</td>
                    <td th:text="${todo.status == 'IN_PROGRESS' ? '進行中' : (todo.status == 'COMPLETED' or todo.completed ? '完了' : '未着手')}">未着手</td>
                    <td>
                        <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                        <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
